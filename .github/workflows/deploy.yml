name: Deploy Note-y to GitHub Pages

on:
  # Trigger the workflow on pushes to the default branch (main/master)
  push:
    branches:
      - main
      - master

  # Allows manual workflow triggering from GitHub Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Lint - Runs ESLint to enforce code quality & semicolons
  # -------------------------------------------------------------
  lint:
    name: Lint JavaScript Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

  # -------------------------------------------------------------
  # Job 2: Deploy - Publishes static site to GitHub Pages
  # Strictly depends on 'lint' job passing!
  # -------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: lint
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the entire root directory (index.html, style.css, script.js)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
